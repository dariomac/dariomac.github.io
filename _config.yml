# Site settings. /setup-site fills these in; you can edit them any time.

# Which version of the site structure this is. /site:upgrade uses it; don't change it.
site_format: 2

title: Dario Macchi
description: Notes on what I know and what I'm learning.
author: Dario Macchi
url: "https://dariomac.github.io"          # e.g. https://yourname.com, set by /setup-site or /connect-domain
baseurl: ""

# How the site looks. Change it with /site:theme.
theme_name: warm

# Optional photo for the home page, e.g. /assets/images/me.jpg
avatar: ""

# Links shown in the footer. Leave a value empty to hide it.
social:
  github: "dariomac"     # GitHub username
  linkedin: "dariomac"   # the part after linkedin.com/in/
  email: "dariomac@gmail.com"

timezone: UTC
lang: en

# Blog posts live in _posts/YYYY-MM-DD-slug.md and are served at /blog/slug/
permalink: /blog/:title/

# Publish posts even when their date is "in the future" on GitHub's servers.
# Without this, a post dated today can go missing because of time zones.
future: true

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
    values:
      layout: default

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - README.md
  - CLAUDE.md
  - Gemfile
  - Gemfile.lock
  - vendor
